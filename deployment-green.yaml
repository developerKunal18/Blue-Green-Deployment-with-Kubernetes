apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask
      version: green

  template:
    metadata:
      labels:
        app: flask
        version: green

    spec:
      containers:
      - name: flask
        image: flask-demo:v2
        ports:
        - containerPort: 5000
